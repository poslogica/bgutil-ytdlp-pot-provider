services:
  pot-server:
    build:
      context: .
      dockerfile: Dockerfile
      target: server_node
    image: bgutil-ytdlp-pot-provider:local-node
    container_name: bgutil-provider
    init: true
    restart: unless-stopped
    ports:
      - "${POT_SERVER_PORT:-4416}:4416"
    environment:
      TOKEN_TTL: ${TOKEN_TTL:-6}
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://localhost:4416/ping').then(r=>process.exit(r.ok?0:1),()=>process.exit(1))"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 5s

  # Deno-flavored build of the same server. Not started by `docker compose up`
  # on its own; run it explicitly with `docker compose --profile deno up pot-server-deno`.
  pot-server-deno:
    build:
      context: .
      dockerfile: Dockerfile
      target: server_deno
    image: bgutil-ytdlp-pot-provider:local-deno
    container_name: bgutil-provider-deno
    init: true
    restart: unless-stopped
    profiles: ["deno"]
    ports:
      - "${POT_SERVER_PORT:-4416}:4416"
    environment:
      TOKEN_TTL: ${TOKEN_TTL:-6}
    healthcheck:
      test: ["CMD", "deno", "eval", "fetch('http://localhost:4416/ping').then(r=>Deno.exit(r.ok?0:1),()=>Deno.exit(1))"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 5s
